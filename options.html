<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Question Answerer – Settings</title>
  <style>
    :root { --accent: #e5383b; }
    body { margin: 0; background: #17171a; color: #f2f2f2; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 560px; margin: 48px auto; padding: 0 16px; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    h1 span { color: var(--accent); }
    p.sub { color: #a8a8b0; margin: 0 0 28px; }
    label { display: block; font-weight: 600; margin: 18px 0 6px; }
    input, select { width: 100%; padding: 9px 10px; background: #222227; color: #f2f2f2; border: 1px solid #34343c; border-radius: 8px; font: inherit; box-sizing: border-box; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    .hint { color: #8a8a92; font-size: 13px; margin-top: 4px; }
    .hint a { color: #ff8a8c; }
    fieldset { border: 1px solid #34343c; border-radius: 10px; padding: 4px 16px 16px; margin-top: 22px; }
    legend { color: var(--accent); font-weight: 700; padding: 0 6px; }
    .keyset { color: #7ddc8a; font-size: 12px; font-weight: 500; margin-left: 6px; }
    button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 10px 22px; font: inherit; font-weight: 600; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    button.ghost { background: #2a2a30; border: 1px solid #3a3a42; padding: 6px 12px; font-size: 13px; margin-top: 8px; }
    #save { margin-top: 26px; }
    #status { margin-left: 12px; color: #7ddc8a; }
  </style>
</head>
<body>
  <main>
    <h1><span>Question</span> Answerer</h1>
    <p class="sub">Settings — you can set up several providers and switch between them from the popup.</p>

    <label for="provider">Active AI provider</label>
    <select id="provider"></select>

    <div id="sections"></div>

    <div class="hint" style="margin-top:14px">Keys are stored only in this browser. Model boxes accept any model ID — the dropdown just shows suggestions.</div>
    <button id="save">Save</button><span id="status"></span>
  </main>
  <script src="providers.js"></script>
  <script src="options.js"></script>
</body>
</html>
